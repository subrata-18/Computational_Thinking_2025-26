name: Keep Render Server Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render server
        run: |
          curl --fail \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 120 \
            https://computational-thinking-2025-26.onrender.com/health