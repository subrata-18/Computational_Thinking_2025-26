<!DOCTYPE html>
<html>
<head>
    <title>Voice Tutor Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; margin-right: 10px; }
    </style>
</head>
<body>
    <h1>Voice AI Tutor Test</h1>
    <button id="startBtn">Start Session</button>
    <button id="stopBtn" disabled>Stop Session</button>
    <p id="status">Status: Disconnected</p>

    <script>
        let ws;
        let audioContext;
        let mediaStream;
        let scriptProcessor;
        // Gemini sends audio output using a sample rate of 24kHz
        let playContext = new AudioContext({ sampleRate: 24000 }); 
        let nextPlayTime = 0;

        document.getElementById('startBtn').onclick = async () => {
            document.getElementById('status').innerText = 'Status: Connecting...';
            
            // REPLACE THIS URL WITH YOUR CODESPACE PORT FORWARD URL
            // Format: wss://<your-codespace-name>-5000.app.github.dev/VoiceTutor
            const WS_URL = 'ws://127.0.0.1:5000/VoiceTutor';
            
            ws = new WebSocket(WS_URL);
            ws.binaryType = 'arraybuffer';

            ws.onopen = async () => {
                document.getElementById('status').innerText = 'Status: Connected! Speak now.';
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;

                // Capture Microphone natively at 16kHz
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new AudioContext({ sampleRate: 16000 });
                const source = audioContext.createMediaStreamSource(mediaStream);
                
                // Process audio in chunks
                scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);
                source.connect(scriptProcessor);
                scriptProcessor.connect(audioContext.destination);

                let silenceCounter = 0;
                
                scriptProcessor.onaudioprocess = (e) => {
                    if (ws.readyState === WebSocket.OPEN) {
                        const inputData = e.inputBuffer.getChannelData(0);
                        
                        let sumSquares = 0;
                        for (let i = 0; i < inputData.length; i++) {
                            sumSquares += inputData[i] * inputData[i];
                        }
                        const volume = Math.sqrt(sumSquares / inputData.length);
                        
                        // Ultra-sensitive threshold so it always hears you
                        if (volume > 0.0005) {
                            silenceCounter = 0; 
                        } else {
                            silenceCounter++;
                        }
                        
                        // Send audio for about 3 seconds after you stop
                        if (silenceCounter < 15) {
                            const pcmData = new Int16Array(inputData.length);
                            for (let i = 0; i < inputData.length; i++) {
                                pcmData[i] = Math.max(-1, Math.min(1, inputData[i])) * 32767;
                            }
                            ws.send(pcmData.buffer);
                        } 
                        // Exactly when the silence tail finishes, send the cutoff signal
                        else if (silenceCounter === 15) {
                            ws.send("END_OF_SPEECH");
                        }
                    }
                };
            };

            ws.onmessage = async (event) => {
                // Play incoming 24kHz 16-bit PCM audio from Gemini
                const buffer = new Int16Array(event.data);
                const floatData = new Float32Array(buffer.length);
                for (let i = 0; i < buffer.length; i++) {
                    floatData[i] = buffer[i] / 32768.0;
                }

                const audioBuffer = playContext.createBuffer(1, floatData.length, 24000);
                audioBuffer.copyToChannel(floatData, 0);

                const source = playContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(playContext.destination);
                
                // Seamlessly queue audio chunks
                const currentTime = playContext.currentTime;
                if (nextPlayTime < currentTime) nextPlayTime = currentTime;
                source.start(nextPlayTime);
                nextPlayTime += audioBuffer.duration;
            };

            ws.onclose = () => {
                document.getElementById('status').innerText = 'Status: Disconnected';
                stopEverything();
            };
        };

        document.getElementById('stopBtn').onclick = () => {
            if (ws) ws.close();
            stopEverything();
        };

        function stopEverything() {
            if (scriptProcessor) scriptProcessor.disconnect();
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            if (audioContext) audioContext.close();
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }
    </script>
</body>
</html>
